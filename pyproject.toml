[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsconv"
version = "1.0.0"
description = "Universal Uzbek bank statement (xlsx/xls/html/csv) to JSON converter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
bsconv = "bsconv.cli:main"

[tool.setuptools.packages.find]
include = ["bsconv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
